name: App bug
description: Something in the app doesn't work, looks broken or crashes.
title: "[bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where are you running exit 0?
      options:
        - Browser (krink192.github.io)
        - Windows (Exit0.exe)
        - Fedora / RHEL (.rpm)
        - Ubuntu / Debian (.deb)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and OS
      description: "Linux: run `exit0 --version`. Also your distro or Windows version and browser if relevant."
      placeholder: 1.2.0 on Fedora 44 (GNOME, Wayland)
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Terminal output (Linux)
      description: Start the app from a terminal with `exit0` and paste anything it prints.
      render: text
