# Runs the logic and question-bank tests on every push and pull request.
name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node tools/test_core.js
      - name: Every file is under the AGPL
        run: node tools/test_license.js
      - name: Sync merges progress from several devices correctly
        run: node tools/test_sync.js
      - name: Lab shell matches real Bash, and every lab can be completed
        run: node tools/test_shell.js
      - name: Type-the-command questions checked by the lab shell accept right commands and reject wrong ones
        run: node tools/test_questions.js
      - name: Every command drill can be solved, and its listed wrong commands are rejected
        run: node tools/test_drills.js
