# Builds the desktop apps and attaches them to a GitHub Release:
#   Windows  Exit0.exe   (pywebview + PyInstaller)
#   Linux    exit0.deb   (Debian, Ubuntu, Mint, Pop!_OS ...)
#            exit0.rpm   (Fedora, RHEL-family; signed when PACKAGE_SIGNING_KEY is set)
# Publish a release on GitHub (or `gh release create vX.Y.Z`) and this runs automatically.
# Run it by hand from the Actions tab to get test builds as downloads.
# When it finishes, pages.yml republishes the website and the signed dnf/apt repository.
name: Build desktop apps

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

# If a release is deleted and recreated, a newer run for the same tag cancels the older one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test exam logic and question bank
        run: node tools/test_core.js

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install -r desktop/requirements.txt
      - name: Build Exit0.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Exit0
          --icon desktop/icon.ico
          --add-data "docs;docs"
          --add-data "desktop/icon.ico;."
          desktop/main.py
      - name: Check the build
        shell: pwsh
        run: |
          $exe = "dist/Exit0.exe"
          if (-not (Test-Path $exe)) { throw "exe was not built" }
          "{0:N1} MB" -f ((Get-Item $exe).Length / 1MB)
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Exit0.exe

  linux-package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: Prepare files
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p build dist
          cp -r docs build/web && rm -rf build/web/screenshots
          sed "s/@VERSION@/$VERSION/" desktop/linux/exit0 > build/exit0
          echo "Packaging version $VERSION"
      - name: Build .deb and .rpm
        run: |
          "$(go env GOPATH)/bin/nfpm" package --config desktop/linux/nfpm.yaml --packager deb --target dist/exit0.deb
          "$(go env GOPATH)/bin/nfpm" package --config desktop/linux/nfpm.yaml --packager rpm --target dist/exit0.rpm
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/exit0.*

  sign-rpm:
    needs: linux-package
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
      - name: Sign exit0.rpm with rpmsign
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
        run: |
          if [ -z "$PACKAGE_SIGNING_KEY" ]; then
            echo "::warning::PACKAGE_SIGNING_KEY is not set, so exit0.rpm stays unsigned."
            exit 0
          fi
          dnf install -y -q rpm-sign gnupg2
          printf '%s\n' "$PACKAGE_SIGNING_KEY" | gpg --batch --import
          fpr=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          rpmsign --define "_gpg_name $fpr" \
                  --define "_gpg_sign_cmd_extra_args --batch --pinentry-mode loopback" \
                  --addsign exit0.rpm
          gpg --batch --armor --export "$fpr" > exit0.asc
          rpm --import exit0.asc
          rpm -K exit0.rpm
          rpm -K exit0.rpm | grep -q "signatures OK"
          echo "Signed with key $fpr"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: exit0.*
          overwrite: true

  test-deb:
    needs: sign-rpm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
      - name: Install on Ubuntu and check
        run: |
          sudo apt-get update
          sudo apt-get install -y ./exit0.deb
          exit0 --version
          exit0 --check
          test -f /usr/share/applications/exit0.desktop

  test-rpm:
    needs: sign-rpm
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
      - name: Install on Fedora and check
        run: |
          if [ -f exit0.asc ]; then
            rpm --import exit0.asc
            rpm -K exit0.rpm | grep "signatures OK"
          fi
          dnf install -y ./exit0.rpm
          exit0 --version
          exit0 --check
          test -f /usr/share/applications/exit0.desktop

  publish:
    if: github.event_name == 'release'
    needs: [windows, test-deb, test-rpm]
    runs-on: ubuntu-latest
    steps:
      - name: Make sure the tag still points at this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq .sha)
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} now points at ${tag_sha}, not this build (${GITHUB_SHA}). Not attaching files."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Exit0.exe
            out/exit0.deb
            out/exit0.rpm
